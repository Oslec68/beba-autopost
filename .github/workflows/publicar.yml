name: Publicar Reel @beba.wellness

on:
  schedule:
    # Horário de Brasília = UTC-3  ->  09:10, 13:10 e 19:10
    - cron: "10 12 * * *"
    - cron: "10 16 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "ID do post (vazio = próximo da fila)"
        required: false
        default: ""
      teste:
        description: "Só renderizar, sem publicar (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    # Interruptor: os horários automáticos só rodam com a variável AUTOPOST_ATIVO = sim
    # (Settings → Secrets and variables → Actions → aba Variables). O botão "Run workflow" sempre funciona.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOPOST_ATIVO == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy soundfile
          npx -y hyperframes@0.8.198 browser ensure

      - name: Renderizar vídeo
        run: |
          if [ -n "${{ github.event.inputs.post_id }}" ]; then
            python scripts/render_next.py --id "${{ github.event.inputs.post_id }}"
          else
            python scripts/render_next.py
          fi
          echo "POST_ID=$(python -c "import json;print(json.load(open('out/next.json'))['id'])")" >> $GITHUB_ENV

      - name: Preparar link público (GitHub Pages)
        run: |
          mkdir -p site
          cp "out/${POST_ID}.mp4" "site/${POST_ID}.mp4"
          # Capa do Reel: quadro em que título e garrafa já estão na tela
          CAPA=$(python -c "import json;print(json.load(open('out/next.json')).get('capa_ms',2800)/1000)")
          ffmpeg -loglevel error -y -ss "$CAPA" -i "out/${POST_ID}.mp4" -frames:v 1 -q:v 2 "site/${POST_ID}.jpg"
          echo "<!doctype html><title>beba.wellness media</title>" > site/index.html

      - name: Revisor automático (vídeo)
        # Confere duração, áudio e se a capa não saiu vazia. Reprovou = não publica e chega o aviso de falha.
        run: python scripts/revisor.py --video "out/${POST_ID}.mp4" "site/${POST_ID}.jpg"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # o GitHub Pages às vezes recusa ("try again later"): tenta de novo abaixo

      - name: Esperar antes de tentar o deploy de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Esperar o vídeo ficar acessível
        run: |
          URL="${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}${POST_ID}.mp4"
          echo "VIDEO_URL=$URL" >> $GITHUB_ENV
          echo "COVER_URL=${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}${POST_ID}.jpg" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sfI "$URL" > /dev/null; then echo "ok: $URL"; exit 0; fi
            sleep 10
          done
          echo "Vídeo não ficou acessível em $URL"; exit 1

      - name: Publicar no Instagram
        id: pub
        if: github.event.inputs.teste != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/publish_ig.py "$VIDEO_URL" "$COVER_URL"

      - name: Salvar histórico
        if: steps.pub.outcome == 'success'
        run: |
          git config user.name "beba-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git commit -m "Publicado ${POST_ID}" || exit 0
          # até 4 tentativas: se o push falhar, o post já publicado repetiria no dia seguinte
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            echo "push falhou (tentativa $i), repetindo..."; sleep 15
          done
          exit 1

      - name: Publicar também nos Stories
        id: story
        if: steps.pub.outcome == 'success'
        continue-on-error: true   # se o Story falhar, o Reel já está publicado e nada mais é afetado
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/publish_story.py "$VIDEO_URL"

      - name: Aviso de sucesso
        if: steps.pub.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          STORY="Story: ok"; [ "${{ steps.story.outcome }}" = "success" ] || STORY="Story: falhou"
          BLOQ=$(python -c "import json;b=json.load(open('out/next.json')).get('bloqueados',[]);print(' | ⚠️ Revisor barrou: '+', '.join(b) if b else '')")
          python scripts/notify.py "✅ @beba.wellness publicado: ${POST_ID} ${{ steps.pub.outputs.permalink }} | ${STORY}${BLOQ}"

      - name: Aviso de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python scripts/notify.py "❌ Falhou a publicação ${POST_ID:-} — veja ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
