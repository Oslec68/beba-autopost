name: Verificar token do Instagram

on:
  schedule:
    - cron: "17 12 * * 1"   # toda segunda, 09:17 de Brasília
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir se o IG_TOKEN funciona
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/refresh_token.py
      - name: Aviso de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify.py "⚠️ O token do Instagram parou de funcionar. Gere um novo token da Página e atualize o secret IG_TOKEN."
